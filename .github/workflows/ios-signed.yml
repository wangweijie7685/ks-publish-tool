name: iOS 打包（签名 · 需 Apple 开发者账号）

# 需要先在仓库 Settings → Secrets and variables → Actions 里配置：
#   BUILD_CERTIFICATE_BASE64   开发者证书 .p12 的 base64（base64 -i cert.p12 | pbcopy）
#   P12_PASSWORD               .p12 的导出密码
#   PROVISIONING_PROFILE_BASE64 描述文件 .mobileprovision 的 base64
#   KEYCHAIN_PASSWORD          随便设一个临时钥匙串密码
#   APPLE_TEAM_ID              10 位 Team ID
#   BUNDLE_ID                  App 的 Bundle Identifier（要和描述文件一致）
#   可选变量 EXPORT_METHOD      ad-hoc（默认，装自己设备）| app-store | development

on:
  workflow_dispatch:
    inputs:
      export_method:
        description: '导出方式'
        required: true
        default: 'ad-hoc'
        type: choice
        options: [ad-hoc, development, app-store]

env:
  APP_DIR: dart_ks
  FLUTTER_VERSION: '3.47.9'
  EXPORT_METHOD: ${{ inputs.export_method || 'ad-hoc' }}

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: 导入证书与描述文件
        env:
          CERT_B64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          CERT_PASS: ${{ secrets.P12_PASSWORD }}
          PROFILE_B64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASS: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$CERT_B64" | base64 --decode > /tmp/cert.p12
          echo "$PROFILE_B64" | base64 --decode > /tmp/profile.mobileprovision

          security create-keychain -p "$KEYCHAIN_PASS" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASS" build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$CERT_PASS" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASS" build.keychain
          security list-keychains -d user -s build.keychain $(security list-keychains -d user | tr -d '"')

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp /tmp/profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: 生成 ExportOptions.plist
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUNDLE_ID: ${{ secrets.BUNDLE_ID }}
        run: |
          cat > ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>${EXPORT_METHOD}</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>bundleID</key><string>${BUNDLE_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>stripSwiftSymbols</key><true/>
            <key>compileBitcode</key><false/>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key><string>$(basename /tmp/profile.mobileprovision)</string>
            </dict>
          </dict>
          </plist>
          EOF

      - name: 编译并导出 ipa
        run: flutter build ipa --release --export-options-plist=ios/ExportOptions.plist

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: Runner-signed-ipa
          path: |
            ${{ env.APP_DIR }}/build/ios/ipa/*.ipa
            ${{ env.APP_DIR }}/build/ios/archive/*.xcarchive
          if-no-files-found: error
